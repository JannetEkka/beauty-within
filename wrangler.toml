name = "beauty-within"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# KV for the response cache, try-on images and the units ledger.
# The id is filled in after `wrangler kv namespace create CACHE` (see README).
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Jannet's account is on the global console (yce.perfectcorp.com); India-region accounts use https://yce-api-01.makeupar.com
YOUCAM_API_BASE = "https://yce-api-01.perfectcorp.com"
UNIT_FLOOR = "150"
LIVE_SCANS_PER_DAY = "3"
