binding = "CACHE"
id = "ef924ddb105343b4a87e2518b76fb5fb"

[vars]
# Jannet's account is on the global console (yce.perfectcorp.com); India-region accounts use https://yce-api-01.makeupar.com
YOUCAM_API_BASE = "https://yce-api-01.perfectcorp.com"
UNIT_FLOOR = "150"
LIVE_SCANS_PER_DAY = "3"
